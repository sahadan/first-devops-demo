name: CI Pipeline

# TRIGGER: run on pushes and pull requests to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ] 

jobs:
  test:
    runs-on: ubuntu-latest    # fresh VM from GitHub
    steps:
      - name: Checkout code     # download the repo  
        uses: actions/checkout@v4 # version of action

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests     # a failure here turns the pipeline red
        run: pytest -v